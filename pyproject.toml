[project]
name = "yue2"
description = "Professional neural music generation suite for ComfyUI powered by YuE2 and LLM Studio"
version = "1.0.2"
license = { file = "LICENSE" }
dependencies = [
    "soundfile>=0.12.1",
    "huggingface-hub>=0.23.0",
    "safetensors>=0.4.0",
    "transformers>=4.40.0",
    "tiktoken>=0.7.0",
    "accelerate>=0.28.0",
    "numpy>=1.24.0",
    # "yue2-infer>=0.1.5",  # Auto-installed from bundled wheel in wheels/
]
requires-python = ">=3.10"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/nvmax/ComfyUI-YuE2"
Issues = "https://github.com/nvmax/ComfyUI-YuE2/issues"

[tool.comfy]
PublisherId = "nvmaxx"
DisplayName = "ComfyUI YuE2"
includes = [
    "web",
    "wheels",
    "example_workflows",
]
